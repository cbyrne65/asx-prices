name: Daily ASX prices

on:
  schedule:
    # 06:30 UTC Mon-Fri = 5:30pm Melbourne in summer (AEDT), 4:30pm in winter (AEST).
    # Both are after the ASX closing auction.
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python fetch_prices.py

      - name: Commit prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Prices $(date -u +%Y-%m-%d)"
            git push
          fi
